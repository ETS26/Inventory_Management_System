<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - InventoryManagement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .btn-primary {
            background-color: #0d6efd;
            padding: 10px;
            font-weight: 600;
        }
        .brand-logo {
            color: #0d6efd;
            font-size: 2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-logo fw-bold">
                <i class="fas fa-shopping-cart me-2"></i>InventoryPro
            </div>
            <h5 class="text-muted fw-normal">Hesabınıza giriş yapın</h5>
        </div>
        
        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" >
                <label for="emailInput">Email adress</label>
            </div>
            
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="passwordInput" placeholder="Password">
                <label for="passwordInput">Password</label>
            </div>

            <div id="errorMessage" class="alert alert-danger d-none py-2 small" role="alert">
                Email veya şifre hatalı!
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                    <i class="fas fa-sign-in-alt me-2"></i>Giriş Yap
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">Hesabınız yok mu? <a href="#" class="text-decoration-none">Kayıt Ol</a></small>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessageDiv = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // Sayfanın yenilenmesini engelle

            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const submitButton = document.querySelector('button[type="submit"]');

            // Butonu pasif yap (Yükleniyor efekti)
            const originalBtnText = submitButton.innerHTML;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Giriş Yapılıyor...';
            submitButton.disabled = true;
            errorMessageDiv.classList.add('d-none');

            try {
                // 1. Backend API'ye İstek At
                // Dikkat: Port numarasını (7057) kendi projenizinkiyle değiştirin
                const response = await fetch('/api/Users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: email, 
                        password: password 
                    })
                });

                const data = await response.json();

                if (response.ok && data.isSuccess) {
                    // 2. BAŞARILI: Token'ı kaydet ve Yönlendir
                    localStorage.setItem('jwtToken', data.token);
                    localStorage.setItem('userName', data.fullName);
                    
                    // Dashboard sayfasına git
                    window.location.href = 'dashboard.html';
                } else {
                    // 3. BAŞARISIZ: Hata mesajını göster
                    throw new Error(data.errorMessage || 'Giriş başarısız.');
                }

            } catch (error) {
                console.error("Hata:", error);
                errorMessageDiv.textContent = error.message || "Sunucuya bağlanılamadı.";
                errorMessageDiv.classList.remove('d-none');
                
                // Butonu eski haline getir
                submitButton.innerHTML = originalBtnText;
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
