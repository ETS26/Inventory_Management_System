<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envanter - InventoryPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <div class="bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold text-uppercase border-bottom">
                <i class="fas fa-shopping-cart me-2"></i>InventoryPro
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="inventory.html" class="list-group-item list-group-item-action bg-transparent second-text active">
                    <i class="fas fa-box me-2"></i>Inventory
                </a>
                <a href="stock-movements.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-exchange-alt me-2"></i>Stock Movements
                </a>               
                <a href="#" onclick="logout()" class="list-group-item list-group-item-action bg-transparent text-danger fw-bold mt-4 border-top">
                    <i class="fas fa-power-off me-2"></i>Logout
                </a>
            </div>
        </div>

        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-4 px-4">
                <div class="d-flex align-items-center">
                    <i class="fas fa-align-left primary-text fs-4 me-3" id="menu-toggle"></i>
                    <h2 class="fs-2 m-0">Inventory Management</h2>
                </div>
            </nav>

            <div class="container-fluid px-4">

                <div class="row my-4">
                    <div class="col-md-7">
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-white border-0"><i class="fas fa-search text-muted"></i></span>
                            <input type="text" class="form-control border-0" id="searchInput" placeholder="Ürün adı, barkod veya kategori ara...">
                        </div>
                    </div>
                    <div class="col-md-5 text-end">
                        <button class="btn btn-outline-dark me-2"><i class="fas fa-filter me-1"></i> Filtrele</button>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">
                            <i class="fas fa-plus me-1"></i> Yeni Stok Ekle
                        </button>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="bg-white shadow-sm rounded-4 overflow-hidden">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0" style="border-collapse: separate; border-spacing: 0;">
                                    <thead class="bg-light text-secondary">
                                        <tr style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">
                                            <th scope="col" class="py-3 ps-4" width="5%">#</th>
                                            <th scope="col" class="py-3" width="30%">Ürün Detayı</th>
                                            <th scope="col" class="py-3" width="15%">Stok Durumu</th>
                                            <th scope="col" class="py-3" width="15%">Fiyatlandırma</th>
                                            <th scope="col" class="py-3" width="15%">Son Kul. Tarihi</th>
                                            <th scope="col" class="py-3" width="10%">Durum</th>
                                            <th scope="col" class="py-3 pe-4 text-end" width="10%">İşlemler</th>
                                        </tr>
                                    </thead>
                                    <tbody id="inventoryTableBody" class="border-top-0">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwtToken');
        if (!token) window.location.href = 'login.html';

        var el = document.getElementById("wrapper");
        var toggleButton = document.getElementById("menu-toggle");
        toggleButton.onclick = function () { el.classList.toggle("toggled"); };

        function logout() {
            localStorage.removeItem('jwtToken');
            localStorage.removeItem('userName');
            window.location.href = 'login.html';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
