<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envanter - InventoryPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold text-uppercase border-bottom">
                <i class="fas fa-shopping-cart me-2"></i>InventoryPro
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="inventory.html" class="list-group-item list-group-item-action bg-transparent second-text active">
                    <i class="fas fa-box me-2"></i>Inventory
                </a>
                <a href="stock-movements.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-exchange-alt me-2"></i>Stock Movements
                </a>
                <a href="products.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-tags me-2"></i>Products
                </a>

                <a href="suppliers.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold"><i class="fas fa-users me-2"></i>Suppliers</a>

                <a href="#" onclick="logout()" class="list-group-item list-group-item-action bg-transparent text-danger fw-bold mt-4 border-top">
                    <i class="fas fa-power-off me-2"></i>Logout
                </a>
            </div>
            <div class="sidebar-footer p-3 text-center bg-light border-top">
                <small class="text-muted" style="font-size: 0.75rem;">Version 1.0.0 <br> &copy; 2025 Enterprise</small>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
                <div class="container-fluid">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-align-left primary-text fs-4 me-3 cursor-pointer" id="menu-toggle"></i>
                        <h2 class="fs-4 m-0 fw-bold text-dark">Envanter Yönetimi</h2>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid px-4 py-4">
                <!-- Search & Actions -->
                <div class="row mb-4">
                    <div class="col-md-7 mb-2 mb-md-0">
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="fas fa-search text-muted"></i>
                            </span>
                            <input type="text" class="form-control border-start-0" id="searchInput" placeholder="Ürün adı, barkod veya kategori ara...">
                        </div>
                    </div>
                    <div class="col-md-5 text-end">
                        <button class="btn btn-outline-secondary me-2">
                            <i class="fas fa-filter me-1"></i> Filtrele
                        </button>
                    </div>
                </div>

                <!-- Inventory Table -->
                <div class="row">
                    <div class="col">
                        <div class="bg-white shadow-sm rounded-4 overflow-hidden">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="bg-light text-secondary">
                                        <tr>
                                            <th class="py-3 ps-4">#</th>
                                            <th class="py-3">Ürün Detayı</th>
                                            <th class="py-3">Barkod</th>
                                            <th class="py-3">Stok Durumu</th>
                                            <th class="py-3">Fiyatlandırma</th>
                                            <th class="py-3">Son Kul. Tarihi</th>
                                            <th class="py-3">Durum</th>
                                            <th class="py-3 pe-4 text-end">İşlemler</th>
                                        </tr>
                                    </thead>
                                    <tbody id="inventoryTableBody">
                                        <tr>
                                            <td colspan="7" class="text-center py-5">
                                                <div class="spinner-border text-primary" role="status"></div>
                                                <p class="text-muted mt-2">Yükleniyor...</p>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('jwtToken')) window.location.href = 'login.html';

        document.getElementById("menu-toggle").onclick = function () {
            document.getElementById("wrapper").classList.toggle("toggled");
        };

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>

    <script src=" https: //cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/inventory.js"></script>

 </body>
</html>
