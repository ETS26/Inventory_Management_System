<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asistan - InventoryPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .chat-page-wrapper {
            height: calc(100vh - var(--navbar-height) - 1px);
            display: flex;
            flex-direction: column;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 900px;
            margin: auto;
            background-color: #fff;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            display: flex;
            align-items: flex-end;
            gap: 1rem;
            max-width: 80%;
            animation: fadeIn 0.4s ease-out;
        }
        .message-content {
            padding: 0.75rem 1.25rem;
            border-radius: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.user .message-content {
            background-color: var(--main-bg-color);
            color: white;
            border-bottom-right-radius: 0.5rem;
        }
        .message.ai .message-content {
            background-color: #f1f3f5;
            color: #343a40;
            border-bottom-left-radius: 0.5rem;
        }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            flex-shrink: 0;
        }
        .message.ai .message-avatar {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .chat-input-form {
            display: flex;
            padding: 1.5rem;
            border-top: 1px solid #e9ecef;
            background-color: #f8f9fa;
        }
        .chat-input-form input {
            flex-grow: 1;
            border-radius: 50px !important;
            padding: 0.75rem 1.5rem;
            border: 1px solid #dee2e6;
        }
        .chat-input-form button {
            border-radius: 50% !important;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
        }
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #ced4da;
            border-radius: 50%;
            animation: bounce 1.4s infinite both;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

    <div class="d-flex" id="wrapper">
        <div class="bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold text-uppercase border-bottom">
                <i class="fas fa-shopping-cart me-2"></i>InventoryETS
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="inventory.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-box me-2"></i>Inventory
                </a>
                <a href="stock-movements.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-exchange-alt me-2"></i>Stock Movements
                </a>
                <a href="products.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-tags me-2"></i>Products
                </a>
                <a href="suppliers.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-users me-2"></i>Suppliers
                </a>
                <a href="ai-chatbot.html" class="list-group-item list-group-item-action bg-transparent second-text active">
                    <i class="fas fa-robot me-2"></i>AI Asistan
                </a>
                <a href="#" onclick="logout()" class="list-group-item list-group-item-action bg-transparent text-danger fw-bold mt-4 border-top">
                    <i class="fas fa-power-off me-2"></i>Logout
                </a>
            </div>
            <div class="sidebar-footer p-3 text-center bg-light border-top">
                <small class="text-muted" style="font-size: 0.75rem;">Version 1.0.0 <br> &copy; 2025 Enterprise</small>
            </div>
        </div>

        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 border-bottom shadow-sm">
                <div class="d-flex align-items-center w-100 justify-content-between">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-align-left primary-text fs-4 me-3 cursor-pointer" id="menu-toggle"></i>
                        <h2 class="fs-4 m-0 fw-bold text-dark">AI Asistan</h2>
                    </div>

                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item dropdown">
                            <a class="nav-link p-0" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <div class="user-profile-section d-flex align-items-center bg-light px-3 py-1 rounded-pill border">
                                    <div class="text-end me-3" style="line-height: 1.2;">
                                        <span class="d-block fw-bold text-dark small" id="navFullName">Yükleniyor...</span>
                                        <small class="d-block text-primary fw-bold" style="font-size: 0.65rem;" id="navCompany">...</small>
                                    </div>
                                    <div class="profile-circle bg-primary text-white rounded-circle d-flex justify-content-center align-items-center fw-bold" style="width: 35px; height: 35px;" id="navProfileCircle">
                                        U
                                    </div>
                                    <i class="fas fa-chevron-down ms-2 text-muted small"></i>
                                </div>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg mt-2 rounded-3">
                                <li><div class="dropdown-header text-muted small fw-bold">HESAP</div></li>
                                <li><a class="dropdown-item py-2 small" href="#"><i class="fas fa-user me-2 text-primary"></i>Profilim</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item py-2 text-danger small fw-bold" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Çıkış Yap</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4 chat-page-wrapper">
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages">
                        <!-- Messages will be appended here by JavaScript -->
                    </div>
                    <div class="chat-input-form">
                        <input type="text" id="chat-input" class="form-control" placeholder="Sorunuzu buraya yazın...">
                        <button class="btn btn-primary ms-3" id="send-button">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwtToken');
        if (!token) window.location.href = 'login.html';
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/ai-chatbot.js"></script>
</body>
</html>
