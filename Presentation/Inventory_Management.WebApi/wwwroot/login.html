<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - InventoryPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .btn-primary {
            background-color: #0d6efd;
            padding: 10px;
            font-weight: 600;
        }
        .brand-logo {
            color: #0d6efd;
            font-size: 2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-logo fw-bold">
                <i class="fas fa-shopping-cart me-2"></i>InventoryETS
            </div>
            <h5 class="text-muted fw-normal">Hesabınıza giriş yapın</h5>
        </div>
        
        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
                <label for="emailInput">Email adresi</label>
            </div>
            
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="passwordInput" placeholder="Password" required>
                <label for="passwordInput">Şifre</label>
            </div>

            <div id="errorMessage" class="alert alert-danger d-none py-2 small" role="alert"></div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                    <i class="fas fa-sign-in-alt me-2"></i>Giriş Yap
                </button>
            </div>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessageDiv = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const submitButton = document.querySelector('button[type="submit"]');

            const originalBtnText = submitButton.innerHTML;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Giriş Yapılıyor...';
            submitButton.disabled = true;
            errorMessageDiv.classList.add('d-none');

            try {
                const response = await fetch('/api/Users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                console.log('API Response:', data); // Debug

                if (response.ok && data.isSuccess) {
                    // LocalStorage'a kaydet
                    localStorage.setItem('jwtToken', data.token);
                    localStorage.setItem('userName', data.fullName);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('userCompany', data.companyName);
                    localStorage.setItem('userId', data.userId);

                    console.log('Saved to localStorage:', {
                        token: data.token,
                        userName: data.fullName,
                        userRole: data.role,
                        userCompany: data.companyName,
                        userId: data.userId
                    });

                    // Dashboard'a yönlendir
                    window.location.href = '/dashboard.html';
                } else {
                    throw new Error(data.errorMessage || 'Giriş başarısız.');
                }

            } catch (error) {
                console.error("Login Error:", error);
                errorMessageDiv.textContent = error.message || "Sunucuya bağlanılamadı.";
                errorMessageDiv.classList.remove('d-none');

                submitButton.innerHTML = originalBtnText;
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
